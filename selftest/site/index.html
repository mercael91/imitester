<body><h1>Демо-стенд имитеста</h1>
<nav><a href="/about.html">О проекте</a> | <a href="/login.html">Войти</a> | <a href="/missing.html">Битая ссылка</a></nav>
<p>Страница для проверки тестера.</p>
<img src="/logo.png" width="80" height="30">
<form><label for="q">Поиск</label><input id="q" name="q" placeholder="что искать"><button type="button" id="toast">Показать тост</button></form>
<button id="danger">Удалить всё</button>
<div id="out"></div>
<script>
document.getElementById('toast').addEventListener('click', () => {
  document.getElementById('out').textContent = 'Тост показан ' + new Date().toISOString().slice(11,19);
});
document.getElementById('danger').addEventListener('click', () => { document.body.dataset.deleted = '1'; });
</script></body></html>
